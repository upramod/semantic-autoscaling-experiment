apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
  namespace: semantic-scaling
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: loadgen
        image: semantic-loadgen:local
        imagePullPolicy: IfNotPresent
        args:
        - --redis-host=redis
        - --scenario=composition
        - --duration=180
        - --seed=1
        - --output=/tmp/run.csv
        - --drain-timeout=900
