apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: semantic-scaling
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        args: ["redis-server", "--save", "", "--appendonly", "no"]
        ports:
        - containerPort: 6379
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: semantic-scaling
spec:
  selector: {app: redis}
  ports:
  - port: 6379
    targetPort: 6379
