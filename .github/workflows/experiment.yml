name: KEDA Semantic Autoscaling Smoke Test

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/experiment.yml

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo install /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -Lo /tmp/kubectl https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Validate source
        run: |
          python -m compileall scaler worker loadgen analysis
          python -m pip install -r requirements-dev.txt
          pytest -q

      - name: Create Kubernetes cluster
        run: bash scripts/kind_create.sh

      - name: Build experiment images
        run: bash scripts/build_images.sh

      - name: Load images into kind
        run: bash scripts/kind_load_images.sh

      - name: Install KEDA
        run: bash scripts/install_keda.sh

      - name: Deploy experiment components
        run: bash scripts/deploy.sh

      - name: Show cluster state
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl get crd scaledobjects.keda.sh

      - name: Run smoke experiment
        env:
          DURATION: "90"
        run: |
          bash scripts/run_experiment.sh baseline composition 1
          bash scripts/run_experiment.sh semantic composition 1
          python analysis/aggregate.py results

      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p results/diagnostics
          kubectl get all -A -o wide > results/diagnostics/all-resources.txt 2>&1 || true
          kubectl get scaledobjects,hpa -A -o yaml > results/diagnostics/scaling.yaml 2>&1 || true
          kubectl get jobs -n semantic-scaling -o yaml > results/diagnostics/jobs.yaml 2>&1 || true
          kubectl get pods -n semantic-scaling -o yaml > results/diagnostics/pods.yaml 2>&1 || true
          kubectl describe pods -n semantic-scaling > results/diagnostics/pods-describe.txt 2>&1 || true
          kubectl logs -n semantic-scaling deployment/worker --all-pods=true --tail=-1 > results/diagnostics/worker-current.log 2>&1 || true
          for pod in $(kubectl get pods -n semantic-scaling -l app=worker -o name 2>/dev/null); do
            name=${pod#pod/}
            kubectl logs -n semantic-scaling "$name" --previous --tail=-1 >> results/diagnostics/worker-previous.log 2>&1 || true
          done
          for pod in $(kubectl get pods -n semantic-scaling -l job-name=loadgen -o name 2>/dev/null); do
            name=${pod#pod/}
            kubectl logs -n semantic-scaling "$name" --tail=-1 >> results/diagnostics/loadgen.log 2>&1 || true
          done
          kubectl logs -n semantic-scaling deployment/semantic-external-scaler --tail=-1 > results/diagnostics/scaler.log 2>&1 || true
          kubectl logs -n keda deployment/keda-operator --tail=2000 > results/diagnostics/keda-operator.log 2>&1 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-autoscaling-smoke-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
