name: KEDA Semantic Autoscaling Smoke Test

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo install /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -Lo /tmp/kubectl https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Validate source
        run: |
          python -m compileall scaler worker loadgen analysis
          python -m pip install -r requirements-dev.txt
          pytest -q

      - name: Create Kubernetes cluster
        run: bash scripts/kind_create.sh

      - name: Build experiment images
        run: bash scripts/build_images.sh

      - name: Load images into kind
        run: bash scripts/kind_load_images.sh

      - name: Install KEDA
        run: bash scripts/install_keda.sh

      - name: Deploy experiment components
        run: bash scripts/deploy.sh

      - name: Show cluster state
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl get crd scaledobjects.keda.sh

      - name: Run smoke experiment
        env:
          DURATION: "90"
        run: |
          bash scripts/run_experiment.sh baseline composition 1
          bash scripts/run_experiment.sh semantic composition 1
          python analysis/aggregate.py results

      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p results/diagnostics
          kubectl get all -A -o wide > results/diagnostics/all-resources.txt 2>&1 || true
          kubectl get scaledobjects,hpa -A -o yaml > results/diagnostics/scaling.yaml 2>&1 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-autoscaling-smoke-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
